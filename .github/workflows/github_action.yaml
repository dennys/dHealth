name: Flutter CI/CD Pipeline

on:
  push:
    branches: ["*"]
    # tags: ["v*"] # Trigger on version tags
  pull_request:
    branches:
      - "*"
      #- main
  workflow_dispatch:

# Define reusable flutter setup to avoid duplication
jobs:
  flutter_setup:
    name: Setup Environment
    runs-on: ubuntu-latest
    outputs:
      flutter-version: "3.29.0"
    steps:
      # Checkout the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Java (required for Android builds)
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle" # Cache Gradle dependencies

      # Set up Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.0"
          channel: "stable"
          cache: true
          cache-key: flutter-${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}

      # Cache Flutter dependencies to speed up builds
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
          key: ${{ runner.os }}-deps-${{ hashFiles('**/pubspec.lock', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      # Install dependencies once here to save time in later jobs
      - name: Install dependencies
        run: flutter pub get

  test:
    name: Run Tests
    needs: flutter_setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.flutter_setup.outputs.flutter-version }}
          cache: true
          cache-key: flutter-${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}

      # Get Flutter dependencies
      - name: Install dependencies
        run: flutter pub get

      # Run Flutter analyze to check for lint issues
      - name: Analyze code
        run: flutter analyze || true # Continues even if warnings are found

      # Use a more efficient approach for lcov installation
      - name: Cache apt packages
        id: apt-cache
        uses: actions/cache@v4
        with:
          path: /var/lib/apt/lists/ # Ubuntu package index cache location
          key: ${{ runner.os }}-apt-lcov-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-apt-lcov-

      - name: Install lcov
        if: steps.apt-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q -y
          sudo apt-get install -q -y --no-install-recommends lcov

      - name: Run tests with coverage
        run: |
          flutter test --coverage
          lcov --ignore-errors unused --remove coverage/lcov.info '**/*.g.dart' '**/lib/generated/*' '**/database.g.dart' -o coverage/lcov.info
          # Generate HTML report (optional)
          genhtml coverage/lcov.info -o coverage/html --ignore-errors source

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
          flags: flutter
          name: flutter-coverage
          fail_ci_if_error: false
          # No need for token because the permission is grant (https://github.com/apps/codecov)
          # token: ${{ secrets.CODECOV_TOKEN }} # Make sure to add this to your GitHub secrets

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/html
          retention-days: 7 # Limit retention to save space


