name: Flutter CI/CD Pipeline

on:
  push:
    branches: ["*"]
    # tags: ["v*"] # Trigger on version tags
  pull_request:
    branches:
      - "*"
      #- main
  workflow_dispatch:

# Define reusable flutter setup to avoid duplication
jobs:
  flutter_setup:
    name: Setup Environment
    runs-on: ubuntu-latest
    outputs:
      flutter-version: '3.29.0'
    steps:
      # Checkout the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Java (required for Android builds)
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: 'gradle'  # Cache Gradle dependencies

      # Cache Android SDK components (NDK, CMake, etc.)
      - name: Cache Android SDK
        uses: actions/cache@v4
        id: android-sdk-cache
        with:
          path: |
            $ANDROID_HOME/ndk
            $ANDROID_HOME/cmake
            $ANDROID_HOME/licenses
          key: ${{ runner.os }}-android-sdk-${{ hashFiles('android/build.gradle') }}
          restore-keys: |
            ${{ runner.os }}-android-sdk-

      # Pre-install Android NDK and CMake to avoid slow installation during build
      - name: Install Android NDK & CMake
        run: |
          echo "y" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1"
          echo "Accepting licenses"
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
          
          # Verify installation paths
          echo "Installed NDK path: $(ls -la ${ANDROID_HOME}/ndk/)"
          echo "Installed CMake path: $(ls -la ${ANDROID_HOME}/cmake/)"

      # Set up Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.0"
          channel: "stable"
          cache: true
          cache-key: flutter-${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}

      # Cache Flutter dependencies to speed up builds
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
          key: ${{ runner.os }}-deps-${{ hashFiles('**/pubspec.lock', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      # Install dependencies once here to save time in later jobs
      - name: Install dependencies
        run: flutter pub get

  test:
    name: Run Tests
    needs: flutter_setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.flutter_setup.outputs.flutter-version }}
          cache: true
          cache-key: flutter-${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}

      # Get Flutter dependencies
      - name: Install dependencies
        run: flutter pub get

      # Run Flutter analyze to check for lint issues
      - name: Analyze code
        run: flutter analyze || true   # Continues even if warnings are found

      # Use a more efficient approach for lcov installation
      - name: Cache apt packages
        id: apt-cache
        uses: actions/cache@v4
        with:
          path: /var/lib/apt/lists/  # Ubuntu package index cache location
          key: ${{ runner.os }}-apt-lcov-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-apt-lcov-

      - name: Install lcov
        if: steps.apt-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q -y
          sudo apt-get install -q -y --no-install-recommends lcov

      - name: Run tests with coverage
        run: |
          flutter test --coverage
          lcov --ignore-errors unused --remove coverage/lcov.info '**/*.g.dart' '**/lib/generated/*' '**/database.g.dart' -o coverage/lcov.info
          # Generate HTML report (optional)
          genhtml coverage/lcov.info -o coverage/html --ignore-errors source

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
          flags: flutter
          name: flutter-coverage
          fail_ci_if_error: false
          # No need for token because the permission is grant (https://github.com/apps/codecov)
          # token: ${{ secrets.CODECOV_TOKEN }} # Make sure to add this to your GitHub secrets

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/html
          retention-days: 7  # Limit retention to save space

  build:
    name: Build APK
    needs: [flutter_setup, test]
    runs-on: ubuntu-latest
    # Only build if push or workflow_dispatch, not PR
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.flutter_setup.outputs.flutter-version }}
          cache: true
          cache-key: flutter-${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}

      - name: Install dependencies
        run: flutter pub get

      # Configure Android build settings with correct paths
      - name: Configure Android build settings
        run: |
          echo "Creating android directory if it doesn't exist"
          mkdir -p android
          
          echo "Writing precise paths to local.properties"
          echo "ndk.dir=${ANDROID_HOME}/ndk/27.0.12077973" > android/local.properties
          echo "flutter.sdk=${FLUTTER_ROOT}" >> android/local.properties
          
          # Add explicit cmake configuration to gradle.properties instead
          mkdir -p android/app
          echo "android.defaults.buildfeatures.buildconfig=true" > android/gradle.properties
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          echo "android.cmake.path=${ANDROID_HOME}/cmake/3.22.1" >> android/gradle.properties
          
          # Add explicit cmake version to build.gradle
          if [ -f "android/app/build.gradle" ]; then
            echo "Configuring CMake version in build.gradle"
            sed -i '/defaultConfig {/a \\        externalNativeBuild {\n            cmake {\n                version "3.22.1"\n            }\n        }' android/app/build.gradle
          fi

      - name: Build debug APK
        run: flutter build apk --debug --no-tree-shake-icons

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7  # Limit retention to save space

  release:
    name: Create Release
    needs: [flutter_setup, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.flutter_setup.outputs.flutter-version }}
          cache: true
          cache-key: flutter-${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}

      - name: Install dependencies
        run: flutter pub get

      # Configure Android build settings to use cached NDK and CMake
      - name: Configure Android build settings
        run: |
          echo "ndk.dir=${ANDROID_HOME}/ndk/27.0.12077973" >> android/local.properties
          echo "cmake.dir=${ANDROID_HOME}/cmake/3.22.1" >> android/local.properties

      - name: Build release APK
        run: |
          flutter build apk --release --split-per-abi
          mv build/app/outputs/flutter-apk/app-*-release.apk .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            app-*-release.apk
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
