name: dHealth

on:
  push:
    branches: ["*"]
    # tags: ["v*"] # 要發正式版再打開（搭配下面的 release job）
  pull_request:
    branches:
      - "*"
  workflow_dispatch:

# 同一個分支只留最新一次跑；PR 再推就直接掐掉還在跑的舊的
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 與開發機 /home/v5/flutter 同版；日後升版只改這行
  FLUTTER_VERSION: "3.47.9"
  JAVA_VERSION: "21"

jobs:
  # 以前這裡有個「Setup Environment」job，只做 pub get 再吐一個寫死的版本字串，
  # 後面的 job 又重 checkout + 重 pub get → 等於白花一分鐘與一次快取寫入。
  # 全部收進同一個 job：環境只裝一次，而且現在會真的 build APK
  # （以前 CI 完全沒驗 Android build，本地踩過的 aapt2/AOT/strip 類問題 CI 一張網都抓不到）。
  ci:
    name: analyze / test / build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"
          cache: "gradle"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          cache-key: flutter-${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}

      - name: Cache pub and gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
          key: ${{ runner.os }}-deps-${{ hashFiles('**/pubspec.lock', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: Install dependencies
        run: flutter pub get

      # 有 issue 就要讓 CI 紅（flutter analyze 的 --fatal-warnings / --fatal-infos 預設皆 on）
      - name: Analyze code
        run: flutter analyze

      # libsqlite3-dev：drift 的 host 端測試要用 sqlite3 FFI
      # lcov：跑覆蓋率
      - name: Install system packages
        run: |
          sudo apt-get update -q -y
          sudo apt-get install -q -y --no-install-recommends libsqlite3-dev lcov

      - name: Run tests with coverage
        run: |
          flutter test --coverage
          lcov --ignore-errors unused --remove coverage/lcov.info '**/*.g.dart' '**/app_localizations*.dart' '**/database.g.dart' -o coverage/lcov.info
          genhtml coverage/lcov.info -o coverage/html --ignore-errors source

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
          flags: flutter
          name: flutter-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/html
          retention-days: 7

      # arm64 就夠（真機都是 arm64），也省一半時間
      - name: Build debug APK
        run: flutter build apk --debug --target-platform android-arm64

      # release 簽章：keystore 與密碼都在 GitHub secrets，repo 裡零機密。
      # 沒設 secrets 就退回 debug 簽章（fork 也能過 CI）。
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::KEYSTORE_B64 not set, release APK will be debug-signed"
            exit 0
          fi
          # secret 常被判貼時帶進 \r\n 或空白，一律清掉再用
          PW=$(printf '%s' "$KEY_PASSWORD" | tr -d '[:space:]')
          printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > android/app/dhealth.keystore
          keytool -list -keystore android/app/dhealth.keystore -storepass "$PW" >/dev/null 2>&1 \
            || { echo "::error::keystore 開不起來：KEY_PASSWORD 與 KEYSTORE_B64 不是同一把 key（或值被剪到）"; exit 1; }
          printf 'storeFile=dhealth.keystore\nstorePassword=%s\nkeyAlias=dhealth\nkeyPassword=%s\n' "$PW" "$PW" > android/key.properties

      # --no-tree-shake-icons：沿用原本註解掉的 build job 的意圖，避免動態引用的 Material icon
      # 被 tree-shake 掉變成豆腐
      - name: Build release APK
        run: flutter build apk --release --target-platform android-arm64 --no-tree-shake-icons

      # AGP 9 沒有 applicationVariants 可改輸出檔名，發佈檔名在 CI 端組裝。
      - name: Rename release APK
        run: |
          v=$(grep '^version:' pubspec.yaml | cut -d: -f2 | cut -d+ -f1 | tr -d '[:space:]')
          cp build/app/outputs/flutter-apk/app-release.apk dHealth-release-v$v.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            build/app/outputs/flutter-apk/*.apk
            dHealth-release-v*.apk
          retention-days: 14
