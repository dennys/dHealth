name: Flutter CI/CD Pipeline

on:
  push:
    branches: ["*"]
    tags: ["v*"] # Trigger on version tags
  pull_request:
    branches: ["*"]
  workflow_dispatch:

jobs:
  setup:
    name: Setup Environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.0"
          channel: "stable"
          cache: true
          cache-key: flutter-${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
          key: ${{ runner.os }}-${{ hashFiles('**/pubspec.lock', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-

  test:
    name: Run Tests
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.0"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze || true

      - name: Install lcov (optimized)
        run: |
          sudo apt-get update -q -y
          sudo apt-get install -q -y --no-install-recommends lcov

      - name: Run tests with coverage
        run: |
          flutter test --coverage
          lcov --ignore-errors unused --remove coverage/lcov.info '**/*.g.dart' '**/lib/generated/*' '**/database.g.dart' -o coverage/lcov.info
          genhtml coverage/lcov.info -o coverage/html --ignore-errors source

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
          flags: flutter
          name: flutter-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }} # Make sure to add this to your GitHub secrets

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/html

  build:
    name: Build APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.0"

      - name: Build debug APK
        run: flutter build apk --debug --no-tree-shake-icons
        if: github.event_name != 'pull_request'

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.0"

      - name: Build release APK
        run: |
          flutter build apk --release --split-per-abi
          mv build/app/outputs/flutter-apk/app-*-release.apk .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            app-*-release.apk
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
