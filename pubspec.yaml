name: dhealth
description: "A new Android Step project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  health: ^13.3.2
  permission_handler: ^13.0.2
  fl_chart: ^1.3.0
  package_info_plus: ^10.2.2
  drift: ^2.35.3
  # 原本這裡有已 EOL 的 sqlite3 原生庫依賴(0.6.0+eol 已清空程式碼)，整行刪除：
  # drift >=2.32 不再需要它，libsqlite3.so 改由 sqlite3 3.8.0 的 native-assets hook 提供。
  path_provider: ^2.1.5
  path: ^1.9.1
  provider: ^6.1.5
  shared_preferences: ^2.5.6
  file_picker: ^13.3.2
  share_plus: ^13.3.1
  get_it: ^9.3.0

  intl: ^0.20.2
  awesome_notifications: ^0.10.1

  workmanager: ^0.10.10

dependency_overrides:
  # 本機 aarch64 沒有可用的 NDK/cmake（Google 無 linux-arm64 host），
  # path_provider_android 2.3.x 改走 jni/jni_flutter 會觸發 CMake 原生編譯而失敗。
  # 釘在最後一個不需要原生編譯的版本。
  path_provider_android: 2.2.23

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # 測 SharedPreferencesAsync 要用官方 in-memory 實作；SharedPreferences.setMockInitialValues
  # 只覆蓋舊的 SharedPreferences API，Async 版會直接噴 instance must be set。
  shared_preferences_platform_interface: ^2.4.1
  # test 1.33.0 需要 test_api 0.7.15，但 Flutter 3.47.9 的 flutter_test 死鎖 test_api 0.7.12
  # （= test 1.31.1），所以這裡只能寫 ^1.31.1；Flutter 升版後 pub 會自動給更高版。
  test: ^1.31.1
  mockito: ^5.8.1
  drift_dev: ^2.35.2 # Must match the drift version
  # 2.17.x 依賴 build >=5.0.0，與 mockito(上限 build <5.0.0) 不相容（2.17.0 已 retracted）；
  # 2.16.2 需要 analyzer ^14.3.0，又與 test 1.31.1(analyzer <14) 衝突，故停在 2.16.1
  build_runner: ^2.16.1

flutter:
  uses-material-design: true
  generate: true # This enables code generation for localization
